<style>
/* Dương Gia Đặt Hàng — app dành cho ĐẠI LÝ. Nền sáng (ảnh sản phẩm rõ), cùng bảng màu nhận diện với app nội bộ: than #231815 · cam #E18A24 · kem #F5F0E6 */
:root{--ink:#231815;--ink2:#5D544B;--dim:#8A8072;--bg:#F5F0E6;--paper:#FFFFFF;--line:#E6DFD3;--line2:#D4CBBC;--acc:#E18A24;--acc2:#C9731A;--accSoft:#FBEEDC;--ok:#3E8E55;--warn:#B8860B;--bad:#C8463A;--r:14px;--sh:0 8px 24px rgba(35,24,21,.10)}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow-x:clip} button,input,select,textarea{font:inherit;color:inherit} h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em} a{color:var(--acc2)}
.hide{display:none!important} .mut{color:var(--ink2)} .dim{color:var(--dim)} .acc{color:var(--acc2)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.right{text-align:right} .center{text-align:center} .b{font-weight:700} .sb{font-weight:600} .nowrap{white-space:nowrap} .small{font-size:12.5px} .xs{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1} .col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(max-width:640px){.grid2{grid-template-columns:1fr}}
/* khung */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)} .top .in{max-width:1180px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.top img{height:30px} .top .ttl{font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--acc2);text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto} .nb{padding:8px 13px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px;position:relative}
.nb.on{background:var(--accSoft);color:var(--ink);border-color:#F2D7B4} .nb .ct{position:absolute;top:2px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#1b120c;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.uchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-width:0} .uchip b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.main{max-width:1180px;margin:0 auto;padding:16px 16px 110px}
@media(max-width:860px){.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;margin:0;z-index:40}.nb{font-size:11.5px;padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}.nb .ic{font-size:18px}.top .ttl{display:none}.uchip{margin-left:auto}.main{padding:12px 12px 120px}}
@media(min-width:861px){.nb .ic{display:none}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 rgba(35,24,21,.03)} .card h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
label.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.inp{width:100%;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;color:var(--ink);min-height:42px} .inp:focus{border-color:var(--acc)} textarea.inp{min-height:76px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:10px 16px;border-radius:11px;cursor:pointer;font-weight:600;min-height:42px;transition:.15s}
.btn:hover{border-color:var(--acc)} .btn:disabled{opacity:.45;cursor:not-allowed} .btn.p{background:var(--acc);border-color:var(--acc);color:#1b120c} .btn.p:hover{background:var(--acc2)} .btn.g{background:transparent} .btn.d{border-color:var(--bad);color:var(--bad)} .btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:9px}
.btn.k{background:var(--ink);border-color:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:12.5px;cursor:pointer;color:var(--ink2);white-space:nowrap} .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700} .chip img{height:14px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.pill.cho{background:#FBEEDC;color:#8a5a12} .pill.len{background:#E3F1E7;color:#2f6f43} .pill.tu{background:#F7DEDB;color:#9a2f25} .pill.huy{background:#ECE8E1;color:#6b625a}
.pill.moi{background:#E3EAF7;color:#2f4f8a} .pill.xn{background:#EAE4F7;color:#5a3f9a} .pill.giao{background:#FBEEDC;color:#8a5a12} .pill.ht{background:#E3F1E7;color:#2f6f43}
.pill.con{background:#E3F1E7;color:#2f6f43} .pill.sap{background:#FBEEDC;color:#8a5a12} .pill.het{background:#ECE8E1;color:#6b625a}
.hang{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.04em;background:var(--hm,#B9AE9E);color:#1b120c;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:var(--sh);z-index:100;max-width:90vw;opacity:0;transition:.25s;pointer-events:none} .toast.on{opacity:1;bottom:100px} .toast.bad{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(35,24,21,.55);display:none;align-items:flex-end;justify-content:center;z-index:90} .modal.on{display:flex}
.modal .box{background:#fff;border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto} @media(min-width:640px){.modal{align-items:center;padding:20px}.modal .box{border-radius:20px}} .modal .box h2{font-size:17px;margin-bottom:14px} .modal .box.wide{max-width:680px}
.loading{position:fixed;inset:0;background:rgba(245,240,230,.6);display:none;align-items:center;justify-content:center;z-index:200;font-weight:700;letter-spacing:.1em;font-size:13px;color:var(--acc2)} .loading.on{display:flex} .loading .ld-box{display:flex;flex-direction:column;align-items:center;gap:16px} .loading .ld-box .btn{letter-spacing:0;font-size:13px}
/* hero */
.hero{background:linear-gradient(135deg,#231815 0%,#3a2a20 100%);color:#F5F0E6;border-radius:18px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero h1{font-size:19px;color:#fff} .hero p{margin:4px 0 0;color:#D8CFC2;font-size:13.5px;max-width:560px} .hero .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* catalog */
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px} @media(max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:9px}}
.sp{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sp .im{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border-bottom:1px solid var(--line);overflow:hidden} .sp .im img{width:100%;height:100%;object-fit:contain;padding:8px} .sp .im svg{width:62%;height:62%;opacity:.55}
.sp .bd{padding:10px 11px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.sp .qc{font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.2} .sp .gai{font-size:13px;color:var(--ink2)} .sp .th{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--acc2);text-transform:uppercase}
.sp .gia{margin-top:auto;padding-top:6px} .sp .gia .g1{font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums} .sp .gia .g0{font-size:12px;color:var(--dim);text-decoration:line-through} .sp .gia .gl{font-size:11.5px;color:var(--ink2)}
.sp .tt{position:absolute;top:8px;left:8px} .sp .stp{display:flex;align-items:center;gap:6px;margin-top:8px} .stp button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-size:18px;line-height:1;cursor:pointer;font-weight:700} .stp input{width:46px;text-align:center;border:1px solid var(--line2);border-radius:9px;min-height:34px;padding:4px;font-weight:700}
.stp .add{flex:1;min-height:34px;background:var(--acc);border-color:var(--acc);color:#1b120c;border-radius:9px;font-weight:700;cursor:pointer;border:1px solid var(--acc);font-size:13.5px}
@media(max-width:640px){.sp .qc{font-size:14.5px}.sp .gia .g1{font-size:15px}.sp .bd{padding:8px 9px 9px}}
/* giỏ */
.line{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)} .line .im{width:54px;height:54px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff} .line .im img{width:100%;height:100%;object-fit:contain} .line .im svg{width:60%;opacity:.5}
.tot{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums} .tot.big{border:none;padding:12px 0 2px;font-size:21px;font-weight:800;color:var(--acc2);align-items:center} .tot.big span:first-child{font-size:13px;letter-spacing:.08em;color:var(--ink2)} .tot.big span:last-child{white-space:nowrap}
.mini{display:none;position:fixed;left:10px;right:10px;bottom:66px;z-index:35;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;box-shadow:var(--sh);justify-content:space-between;align-items:center;cursor:pointer} @media(max-width:860px){.mini.on{display:flex}}
/* đơn */
table.t{width:100%;border-collapse:collapse;font-size:13.5px} table.t th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)} table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle} table.t .num{text-align:right;font-variant-numeric:tabular-nums}
.dc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:4px;cursor:pointer} .dc:hover{border-color:var(--acc)} .dc .h{display:flex;justify-content:space-between;gap:8px;align-items:center} .dc .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi{background:var(--accSoft);border-radius:12px;padding:12px 14px} .kpi .l{font-size:11.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase} .kpi .v{font-size:19px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.gauge{height:10px;border-radius:999px;background:#EDE6D9;overflow:hidden} .gauge i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.hc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff} .hc.on{border-color:var(--acc);background:var(--accSoft)}
.p-sum .r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums} .p-sum .r.big{font-size:17px;font-weight:800;color:var(--acc2);border:none}
#qrbox img,#qrbox canvas{width:150px;height:150px;display:block;margin:6px auto}
.empty{padding:28px 10px;text-align:center;color:var(--dim)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* v1.1 (19/10/2026): giá nổi bật · đang cập nhật · kính lúp · liên hệ · nút đóng hộp thoại */
.sp .gia .g1{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums} .sp .gia .gl{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
.sp .gia .tk{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:999px;background:#E3F1E7;color:#2f6f43;font-size:11px;font-weight:700}
.sp .gia .cn{font-size:15px;font-weight:700;color:var(--dim)} .sp .gia .dn{display:inline-block;margin-top:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--acc);color:var(--acc2);font-size:11.5px;font-weight:700;text-decoration:none;background:#fff} .sp .gia .dn:hover{background:var(--accSoft)}
.noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;color:var(--dim);font-size:11.5px;font-weight:600;letter-spacing:.04em} .noimg svg{width:44%;height:44%;opacity:.3}
@media(max-width:640px){.sp .gia .g1{font-size:18px}.sp .gia .tk{font-size:10.5px}}
.pv{position:relative;aspect-ratio:1/1;max-height:46vh;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin:0 auto 12px;cursor:zoom-in;touch-action:manipulation} .pv img{width:100%;height:100%;object-fit:contain;display:block}
.pv .lens{position:absolute;width:170px;height:170px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 20px rgba(35,24,21,.35),0 0 0 1px var(--line2);background:#fff no-repeat;pointer-events:none;display:none;z-index:2}
.pv .hint{position:absolute;right:8px;bottom:8px;background:rgba(35,24,21,.72);color:#fff;font-size:11px;padding:4px 9px;border-radius:999px;pointer-events:none}
.pv.none{cursor:default;display:flex;align-items:center;justify-content:center}
.lb{position:fixed;inset:0;background:#0f0b09;z-index:300;display:none;overflow:hidden;touch-action:none;overscroll-behavior:contain} .lb.on{display:block} .lb img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;will-change:transform}
.lb .x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;border:0;font-size:24px;line-height:1;z-index:2;cursor:pointer} .lb .h{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;color:#D8CFC2;font-size:12px;pointer-events:none}
.modal .box{position:relative} .modal .box h2{padding-right:36px} .modal .mx{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:21px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;padding:0} .modal .mx:hover{border-color:var(--acc);color:var(--ink)}
.lh{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px} .lh a{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-decoration:none;color:var(--ink)} .lh a:hover{border-color:var(--acc)} .lh .i{width:44px;height:44px;border-radius:12px;background:var(--accSoft);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none} .lh .l{font-size:11px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;font-weight:700} .lh .v{font-weight:700;font-size:15px;word-break:break-word;margin-top:2px}
.foot{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;color:var(--ink2);font-size:13px} .foot a{font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap} .foot a:hover{color:var(--acc2)}
</style>
</head>
<body>
<div class="top"><div class="in">
  <img class="lw" src="" alt="Dương Gia"><span class="ttl">Đặt hàng</span>
  <div class="nav" id="nav">
    <button class="nb on" data-v="sp"><span class="ic">🛞</span>Sản phẩm</button>
    <button class="nb" data-v="gio"><span class="ic">🛒</span>Giỏ hàng<span class="ct hide" id="gio_ct">0</span></button>
    <button class="nb" data-v="don"><span class="ic">📦</span>Đơn của tôi</button>
    <button class="nb" data-v="hang"><span class="ic">⭐</span>Hạng của tôi</button>
    <button class="nb" data-v="lh"><span class="ic">☎️</span>Liên hệ</button>
  </div>
  <div class="uchip" id="uchip"><button class="btn sm p" onclick="moDangNhap()">Đăng nhập</button></div>
</div></div>

<div class="main">
  <section id="v_sp">
    <div class="hero" id="hero"></div>
    <div class="tool"><input id="q" class="inp" style="max-width:360px" placeholder="Tìm quy cách, mã gai — VD: 12R22.5, D303…" autocomplete="off"><div class="chips" id="th_chips"></div></div>
    <div class="chips" id="nhom_chips" style="margin-bottom:10px"></div>
    <div class="grid" id="grid"></div>
    <div class="xs dim" style="margin-top:12px">Giá đã gồm VAT theo quy định hiện hành. Giá chính thức, chương trình ưu đãi và số lượng xác nhận khi Dương Gia lên đơn. Ảnh minh họa mẫu gai.</div>
  </section>

  <section id="v_gio" class="hide">
    <div class="card"><h3>Giỏ hàng <span class="dim" style="letter-spacing:0;text-transform:none;font-weight:500" id="gio_h3"></span></h3><div id="gio_lines"></div><div id="gio_sum"></div></div>
    <div class="card" style="margin-top:12px" id="gio_giao"></div>
  </section>

  <section id="v_don" class="hide">
    <div class="row" id="don_kpi" style="margin-bottom:12px"></div>
    <div class="card"><h3>Yêu cầu đã gửi <button class="btn sm g" style="margin-left:auto" onclick="taiDon(true)">↻</button></h3><div id="yc_body" class="col"></div></div>
    <div class="card" style="margin-top:12px"><h3>Đơn hàng</h3><div id="dh_body" class="col"></div></div>
  </section>

  <section id="v_hang" class="hide"><div id="hang_body"></div></section>
  <section id="v_lh" class="hide"><div id="lh_body"></div></section>
  <div class="foot" id="foot"></div>
</div>
<div class="lb" id="lb"><img id="lb_img" alt="Ảnh sản phẩm"><button class="x" onclick="dongLB()" aria-label="Đóng">×</button><div class="h">Hai ngón để phóng to · kéo để xem gai · ✕ để thoát</div></div>
<div class="mini" id="mini" onclick="moView('gio')"><span id="mini_l">GIỎ HÀNG</span><span id="mini_v"></span></div>
